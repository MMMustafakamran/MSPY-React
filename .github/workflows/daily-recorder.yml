name: Daily Doc Check, Version Watch and Demo Recording

# One pipeline, three stages, each gating the next:
#
#   1. drift    -- do the live docs still say what doc-snapshot/ says?
#                  On a scheduled run, drift STOPS here, files an issue with the
#                  diff, and points at the Doc sync workflow. Recording against
#                  a page that has moved produces footage documenting nothing.
#   2. versions -- what resolved today, and does the documented install still
#                  work? Reports; never blocks. A moved version is news.
#   3. record   -- three sharded workers, then consolidate.
#
# Stage 1 was previously inside ci/automate.mjs, which ran it three times over
# -- once per shard, each after two minutes of toolchain install -- and could
# only express drift as one red shard racing two green ones.

# GitHub allows a workflow_dispatch at most 10 INPUTS. This form uses all 10.
# Adding another means removing one — that cap is why there are checkboxes per
# doc section rather than per page (20 pages + options would be 24 inputs, which
# is what previously made every manual run fail before any job started).
#
# Sections map to page ids in ci/lib/pages.mjs (PAGE_GROUPS). A page belonging
# to no section fails the run, so nothing becomes silently unreachable here.

on:
  schedule:
    # 23:04 UTC = 4:04 AM PKT (Asia/Karachi, UTC+5, no DST).
    #
    # The twelve repos run in four waves twenty minutes apart (23:04, 23:24,
    # 23:44, 00:04 UTC) so they do not all land on the account's runner limit
    # at the same minute -- when they did, the last workers queued for 38
    # minutes. An odd minute rather than :00 or :30, which are the most
    # contended slots on the platform.
    #
    # GitHub's scheduler is best-effort: this repo's history shows every cron
    # firing three to six hours late. If exact timing ever matters, drive it
    # externally via `gh workflow run`.
    - cron: '4 23 * * *'
  workflow_dispatch:
    inputs:
      group_getting_started:
        description: 'Getting Started — Quickstart, Prebuilt Components'
        type: boolean
        default: false
      group_custom_look:
        description: 'Custom Look & Feel — Slots, Headless UI, Programmatic Control, Inspector'
        type: boolean
        default: false
      group_generative_ui:
        description: 'Generative UI — Display Only, Interactive, Tool Rendering, State Rendering'
        type: boolean
        default: false
      group_app_control:
        description: 'App Control — Frontend Tools, Shared State (read/write), Readables, Auth, Governed Actions'
        type: boolean
        default: false
      group_threads:
        description: 'Rich Threads & Intelligence — Drawer, Headless, Lifecycle, Intelligence Quickstart'
        type: boolean
        default: false
      group_backend:
        description: 'Backend — Copilot Runtime, AG-UI'
        type: boolean
        default: false
      pages:
        description: 'Exact page ids, comma-separated (added to any sections ticked above). Blank + nothing ticked = all pages.'
        required: false
        type: string
        default: ''
      use_lockfile:
        description: 'Install the committed lockfiles instead of re-resolving. Off by default: a normal run picks up the newest versions package.json already allows.'
        required: false
        type: boolean
        default: false
      # One choice rather than three booleans, because workflow_dispatch accepts
      # at most 10 INPUTS and the section checkboxes already claim most of them.
      # Collapsing halt-on-drift, checks-only and commit-snapshot into a single
      # enum buys back two slots and makes the mutually-exclusive cases actually
      # look mutually exclusive.
      run_mode:
        description: 'What this run should do'
        required: false
        type: choice
        default: 'record-through-drift'
        options:
          - 'record-through-drift'   # drift is reported, then recorded anyway
          - 'halt-on-drift'          # behave like the nightly: drift stops the run
          - 'checks-only'            # drift + versions, no recording
      custom_args:
        description: 'Extra recorder args (e.g. --limit=5). Overrides every selection above.'
        required: false
        type: string
        default: ''

concurrency:
  group: daily-recorder-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Resolve the run name and the page selection once, so all three shards agree
  # and a bad selection fails in seconds instead of after three servers boot.
  prepare:
    name: 1. Doc drift gate & run selection
    runs-on: ubuntu-latest
    # The drift check fetches every doc page; a hung docs host must not hold
    # the runner (and the concurrency group) for the default six hours.
    timeout-minutes: 15
    outputs:
      run_name: ${{ steps.meta.outputs.run_name }}
      pages: ${{ steps.meta.outputs.pages }}
      drifted: ${{ steps.check.outputs.drifted }}
      drift_state: ${{ steps.check.outputs.state }}
      should_record: ${{ steps.decide.outputs.should_record }}
      gated: ${{ steps.decide.outputs.gated }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: meta
        env:
          INPUT_PAGES: ${{ inputs.pages }}
        run: |
          set -euo pipefail

          RUN_NAME="$(node ci/run-name.mjs)"
          echo "run_name=$RUN_NAME" >> "$GITHUB_OUTPUT"
          echo "Artifacts will be named: $RUN_NAME"

          SEL_GROUPS=""
          add_group() { [ "$1" = "true" ] && SEL_GROUPS="${SEL_GROUPS:+$SEL_GROUPS,}$2" || true; }
          add_group "${{ inputs.group_getting_started }}" getting_started
          add_group "${{ inputs.group_custom_look }}"     custom_look
          add_group "${{ inputs.group_generative_ui }}"   generative_ui
          add_group "${{ inputs.group_app_control }}"     app_control
          add_group "${{ inputs.group_threads }}"         threads
          add_group "${{ inputs.group_backend }}"         backend

          PAGES="$(node ci/resolve-selection.mjs --pages="${INPUT_PAGES:-}" --groups="$SEL_GROUPS")"
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"

          {
            echo "### 🎬 $RUN_NAME"
            if [ -n "$PAGES" ]; then
              echo "Recording: \`$PAGES\`"
            else
              echo "Recording: **all pages**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- The gate -----------------------------------------------------
      #
      # Recording is only worth doing against a page that still says what it
      # said when doc-snapshot/ was taken. Once the live doc moves, an
      # unattended run publishes clips of a demo that no longer matches it, and
      # nobody is watching a 5am run to notice. So this runs FIRST, cheaply,
      # before three shards each spend two minutes installing a toolchain.
      #
      # It used to run inside ci/automate.mjs, which meant three redundant
      # checks after that install had already been paid for, and a failure that
      # surfaced as one red shard racing two green ones rather than as an answer.
      - name: Check the live docs against doc-snapshot/
        id: check
        run: |
          set +e
          node ci/check-doc-drift.mjs > drift.txt 2>&1
          CODE=$?
          set -e
          cat drift.txt

          # check-doc-drift.mjs exits 2 on drift and 0 when clean. Anything else
          # is the checker itself failing -- docs site unreachable, parse error --
          # which means drift is UNKNOWN, not absent. Treating that as "clean"
          # would record straight through a real change on any morning the docs
          # host has a blip.
          if [ "$CODE" = "2" ]; then
            echo "drifted=true"  >> "$GITHUB_OUTPUT"
            echo "state=drift"   >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "0" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "state=clean"   >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "state=unknown" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## 1. Doc drift"
            echo
            case "$CODE" in
              0) echo "**Clean.** The live docs match the committed snapshot." ;;
              2) echo "**Drifted.** The live docs moved. Recording is halted." ;;
              *) echo "**Unknown.** The drift checker exited $CODE -- it could not read the docs. Drift is unknown, not absent." ;;
            esac
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Open or update the drift issue
        continue-on-error: true
        if: steps.check.outputs.state == 'drift' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let drift = fs.readFileSync('drift.txt', 'utf8').trim();
            if (drift.length > 55000) {
              drift = drift.slice(0, 55000) + '\n... (truncated -- see the drift artifact on the run)';
            }
            const body = [
              'The live docs changed in a way that invalidates what this repo records.',
              'Recording was **halted** -- clips of a demo that no longer matches the',
              'page document nothing.',
              '',
              '### What drifted',
              '',
              '```',
              drift,
              '```',
              '',
              '**To clear:** review the diff above, then run the **Doc sync** workflow',
              '(Actions -> Doc sync -> Run workflow). It rewrites `doc-snapshot/` and',
              'opens a PR carrying this diff in its body. Reconcile the demo pages with',
              'the new code blocks on that branch, merge, then re-run this workflow.',
              '',
              `_Doc sync: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/doc-sync.yml_`,
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');

            const title = 'Doc drift: the live docs moved';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'doc-drift',
            });

            // One issue per drift, reopened by comment rather than duplicated --
            // a daily job that files a fresh issue every morning gets muted.
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['doc-drift'],
              });
            }

      - name: Decide whether to record
        id: decide
        env:
          STATE: ${{ steps.check.outputs.state }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: |
          set -euo pipefail

          # A scheduled run is unattended, so drift halts it and is not asked.
          # A manual run is attended -- the operator sees the summary -- so
          # there drift only halts if they ticked the box.
          GATING=false
          if [ "$STATE" != "clean" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] || [ "${RUN_MODE:-}" = "halt-on-drift" ]; then
              GATING=true
            fi
          fi

          if [ "${RUN_MODE:-}" = "checks-only" ]; then
            echo "should_record=false" >> "$GITHUB_OUTPUT"
            echo "gated=false" >> "$GITHUB_OUTPUT"
            echo "> Checks-only run requested -- stages 1 and 2 only, no recording." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GATING" = "true" ]; then
            echo "should_record=false" >> "$GITHUB_OUTPUT"
            echo "gated=true" >> "$GITHUB_OUTPUT"
            echo "> **Pipeline stopped at stage 1.** The docs moved; recording skipped and an issue filed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_record=true" >> "$GITHUB_OUTPUT"
            echo "gated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.run_name }}-drift
          path: drift.txt
          retention-days: 30
          if-no-files-found: warn

  # ---- 2. Do the versions and the setup still hold? ---------------------
  #
  # Runs only if stage 1 was clean, and never blocks stage 3. Sequenced here
  # rather than left on its own cron -- where, in practice, it had never once
  # fired -- so its answer arrives in the same summary as the run it explains.
  versions:
    name: 2. Versions & setup
    needs: prepare
    # Not should_record: a checks-only run deliberately sets that false while
    # still wanting this stage. What skips stage 2 is the drift gate halting.
    if: needs.prepare.outputs.gated != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Resolve the way a recording run does -- ci/automate.mjs drops the
      # lockfiles by default -- so this describes the range boundaries as they
      # stand this morning, not versions committed months ago.
      #
      # It is NOT authoritative for what the demos ran on. This is a separate
      # job on a separate runner doing its own install, minutes earlier; if a
      # release lands in that window the two legitimately disagree. The
      # recorded truth comes from RUN_REPORT, which reads the installed tree
      # inside the shard that did the recording.
      #
      # The Python side is re-resolved in the next step (`uv lock --upgrade`)
      # but never installed or committed here: the fresh uv.lock only travels
      # to the workers through the run-scoped cache below.
      - name: Re-resolve dependencies
        run: |
          set -euo pipefail
          rm -f frontend/package-lock.json autorecorder/package-lock.json
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix autorecorder install --no-audit --no-fund

      # The Python side, resolved the same way the recorder would
      # (`uv sync --upgrade`) but only the lockfile is kept: the shards install
      # from it, so all three record against one resolution.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Re-resolve the backend lockfile
        run: |
          set -euo pipefail
          cd backend
          uv python install 3.12
          uv lock --upgrade

      # One resolution, three shards. Before this, each worker re-resolved
      # on its own -- three installs, and three chances to land on different
      # versions when a release dropped mid-run. The workers restore this
      # cache and install from the lockfiles it carries; a miss falls back
      # to resolving locally exactly as before.
      - name: Share the resolved trees with the workers
        uses: actions/cache/save@v4
        with:
          key: resolved-deps-${{ github.run_id }}
          path: |
            frontend/node_modules
            frontend/package-lock.json
            autorecorder/node_modules
            autorecorder/package-lock.json
            backend/uv.lock

      # This repo has no ci/check-versions.mjs (the Angular siblings do), so there
      # is no classification here of what is outdated-but-out-of-reach. What the
      # re-resolve above proves is still the thing that matters most before
      # recording: the documented install path works today, and these are the
      # versions the demos are about to be recorded against.
      - name: Report the versions this run resolved
        run: |
          set -euo pipefail
          {
            echo "## 2. Versions and setup"
            echo
            echo "Setup verified: a lockfile-free install of frontend/ and"
            echo "autorecorder/ succeeded, so the documented install path works."
            echo
            echo "<details><summary>Resolved top-level versions</summary>"
            echo
            echo '```'
            npm --prefix frontend ls --depth=0 2>&1 || true
            echo
            npm --prefix autorecorder ls --depth=0 2>&1 || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: 2a. Typecheck, tests, README
    needs: [prepare, versions]
    if: always() && needs.prepare.outputs.gated != 'true' && needs.versions.result == 'success'
    # Reporting only. It used to sit inside stage 2, after the cache save, so
    # every worker waited on a typecheck that decides nothing. Now it runs
    # beside the workers on the trees stage 2 resolved.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the resolved trees from stage 2
        uses: actions/cache/restore@v4
        with:
          key: resolved-deps-${{ github.run_id }}
          fail-on-cache-miss: true
          path: |
            frontend/node_modules
            frontend/package-lock.json
            autorecorder/node_modules
            autorecorder/package-lock.json
            backend/uv.lock

      # The runtime route and the slots demo are the two files most likely to
      # break on a CopilotKit bump, and nothing else in the pipeline compiles
      # them: `next dev` serves a page with type errors. Reported, not gating --
      # a doc snippet that no longer typechecks is a finding, not a build break.
      - name: Typecheck frontend and recorder
        run: |
          set +e
          npx --prefix frontend tsc --noEmit -p frontend/tsconfig.json > typecheck.txt 2>&1
          FE=$?
          npx --prefix autorecorder tsc --noEmit -p autorecorder/tsconfig.json >> typecheck.txt 2>&1
          AR=$?
          # Unit tests for the recorder's pure modules (screen parsing, cast
          # pacing, page selection) and the core/ drift check. Neither needs a
          # browser or a service.
          npm --prefix autorecorder test > recorder-tests.txt 2>&1
          UT=$?
          npm --prefix autorecorder run core:check > core-check.txt 2>&1
          CC=$?
          set -e
          cat typecheck.txt recorder-tests.txt core-check.txt
          {
            echo "## 2a. Typecheck, unit tests, core drift"
            echo
            if [ "$FE" = "0" ]; then echo "- frontend typecheck: **clean**"; else echo "- frontend typecheck: **$(grep -c 'error TS' typecheck.txt) error(s)** -- see the job log"; fi
            if [ "$AR" = "0" ]; then echo "- autorecorder typecheck: **clean**"; else echo "- autorecorder typecheck: **errors** -- see the job log"; fi
            if [ "$UT" = "0" ]; then echo "- autorecorder unit tests: **pass** ($(grep -o 'pass [0-9]*' recorder-tests.txt | tail -1))"; else echo "- autorecorder unit tests: **failing** -- see the job log"; fi
            if [ "$CC" = "0" ]; then echo "- autorecorder core/: **matches CORE_MANIFEST.json**"; else echo "- autorecorder core/: **drifted from CORE_MANIFEST.json** -- run \`npm run core:write\` if deliberate"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # README §8 is generated from nav-config.ts and the recorder config. A
      # stale table means a route changed status and nobody re-ran the
      # generator; reported here, fixed with `npm run readme:status`.
      - name: Check the README status table is current
        run: |
          set +e
          node ci/write-readme-status.mjs --check > readme-status.txt 2>&1
          RS=$?
          set -e
          cat readme-status.txt
          if [ "$RS" = "0" ]; then
            echo "- README status table: **current**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- README status table: **stale** -- run \`npm run readme:status\` and commit" >> "$GITHUB_STEP_SUMMARY"
          fi


  record-workers:
    name: 3. Worker ${{ matrix.shard }}/3
    needs: [prepare, versions]
    # `always()` so a red versions job -- which reports, and must not decide
    # whether demos record -- cannot stop stage 3. The drift gate is what
    # decides, and it already has.
    if: always() && needs.prepare.outputs.should_record == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      # Reading and thinking pauses at 85% -- typing, mouse and scrolling are
      # not scaled. See autorecorder/core/overlays/human.ts (PACE).
      AUTORECORD_PACE: '0.85'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CHAT_MODEL_ID: ${{ vars.OPENAI_CHAT_MODEL_ID || 'gpt-4o-mini' }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
      COPILOTKIT_LICENSE_TOKEN: ${{ secrets.COPILOTKIT_LICENSE_TOKEN }}
      # The docs renamed this to CPK_INTELLIGENCE_API_KEY; both are passed
      # through because a repo secret may still carry either name.
      INTELLIGENCE_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
      CPK_INTELLIGENCE_API_KEY: ${{ secrets.CPK_INTELLIGENCE_API_KEY }}
      INTELLIGENCE_API_URL: ${{ vars.INTELLIGENCE_API_URL }}
      INTELLIGENCE_GATEWAY_WS_URL: ${{ vars.INTELLIGENCE_GATEWAY_WS_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            autorecorder/package-lock.json

      # The trees stage 2 resolved this run. On a hit the shard installs from
      # those lockfiles (--use-lockfile) instead of re-resolving: seconds, not
      # minutes, and identical versions on all three workers. On a miss (stage
      # 2 red or skipped) the shard resolves for itself as it always did.
      - name: Restore the resolved trees from stage 2
        id: resolved
        uses: actions/cache/restore@v4
        with:
          key: resolved-deps-${{ github.run_id }}
          path: |
            frontend/node_modules
            frontend/package-lock.json
            autorecorder/node_modules
            autorecorder/package-lock.json
            backend/uv.lock

      # The Chromium build is keyed on the installed playwright-core version,
      # so it downloads once per Playwright release rather than once per shard
      # per day. The runner image already ships the system libraries, so on a
      # hit nothing is installed at all.
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('autorecorder/node_modules/playwright-core/package.json') }}

      - name: Install Playwright & System Chromium Dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          cd autorecorder
          [ -d node_modules/playwright ] || npm install
          npx playwright install --with-deps chromium

      - name: Record demos (shard ${{ matrix.shard }}/3)
        env:
          SELECTED_PAGES: ${{ needs.prepare.outputs.pages }}
          INPUT_CUSTOM_ARGS: ${{ inputs.custom_args }}
          INPUT_USE_LOCKFILE: ${{ inputs.use_lockfile }}
          RESOLVED_HIT: ${{ steps.resolved.outputs.cache-hit }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_CUSTOM_ARGS:-}" ]; then
            RECORD_ARGS="${INPUT_CUSTOM_ARGS}"
          elif [ -n "${SELECTED_PAGES:-}" ]; then
            RECORD_ARGS="--pages=${SELECTED_PAGES} --shard=${SHARD}/3"
          else
            RECORD_ARGS="--shard=${SHARD}/3"
          fi

          EXTRA_FLAGS=""
          if [ "${INPUT_USE_LOCKFILE:-false}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --use-lockfile"
          elif [ "${RESOLVED_HIT:-false}" = "true" ]; then
            # Fresh lockfiles from stage 2, not the committed ones.
            EXTRA_FLAGS="$EXTRA_FLAGS --use-lockfile"
            echo "Using the trees stage 2 resolved this run (cache hit)."
            echo "- Dependencies: installed from the lockfiles stage 2 resolved this run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No shared trees from stage 2; resolving locally."
          fi
          # Always. The drift gate in stage 1 already decided -- it either found
          # the docs clean or was explicitly overridden -- so re-checking here
          # would re-litigate a settled question three times over, and let a
          # transient docs-site blip fail one shard out of three. --skip-doc-drift
          # means the shard never contacts the docs site at all.
          EXTRA_FLAGS="$EXTRA_FLAGS --skip-doc-drift"

          echo "Shard ${SHARD}/3 flags: $EXTRA_FLAGS $RECORD_ARGS"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node ci/automate.mjs $EXTRA_FLAGS $RECORD_ARGS

      - name: Publish Shard Report to GitHub Summary
        if: always()
        run: |
          if [ -f "autorecorder/videos/RUN_REPORT.md" ]; then
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 Summary" >> $GITHUB_STEP_SUMMARY
            cat autorecorder/videos/RUN_REPORT.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 produced no report" >> $GITHUB_STEP_SUMMARY
          fi

      # Consolidate downloads every shard into one folder (merge-multiple), so
      # any file that shares a name across shards -- the reports, the server
      # logs -- would be overwritten by whichever shard uploaded last. Suffix
      # them with the shard number; the videos are already unique per page.
      - name: Name shard-specific files
        if: always()
        run: |
          set -euo pipefail
          cd autorecorder/videos
          for f in RUN_REPORT.md RUN_REPORT.json RECORD_RESULTS.json; do
            [ -f "$f" ] && mv "$f" "${f%.*}-shard-${{ matrix.shard }}.${f##*.}" || true
          done
          if [ -d logs ]; then
            for f in logs/*.log; do
              [ -f "$f" ] && mv "$f" "${f%.log}-shard-${{ matrix.shard }}.log" || true
            done
          fi

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.run_name }}-shard-${{ matrix.shard }}
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/RUN_REPORT-shard-*.md
            autorecorder/videos/RUN_REPORT-shard-*.json
            autorecorder/videos/RECORD_RESULTS-shard-*.json
            autorecorder/videos/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  consolidate-recordings:
    name: 4. Consolidate & merge all video artifacts
    needs: [prepare, record-workers]
    # Nothing to consolidate when the gate stopped the run. Without this it
    # would still run and publish an empty artifact, which reads as "recorded,
    # produced nothing" rather than "never recorded".
    if: always() && needs.prepare.outputs.should_record == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-recordings
          pattern: ${{ needs.prepare.outputs.run_name }}-shard-*
          merge-multiple: true

      # One folder holding every clip from the run, named for the project and
      # the time it ran.
      - name: Upload Consolidated Demo Recordings Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.run_name }}
          path: all-recordings/
          if-no-files-found: ignore
          retention-days: 14
